name: PolevoyJournal
options:
  bundleIdPrefix: ru.mohapx
  deploymentTarget:
    iOS: "17.0"
packages:
  JournalCore:
    path: .
targets:
  PolevoyJournal:
    type: application
    platform: iOS
    sources: [App]
    dependencies:
      - package: JournalCore
        product: JournalCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ru.mohapx.polevoyjournal
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Полевой журнал
        INFOPLIST_KEY_NSCameraUsageDescription: Фотографии замечаний во время обследования
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: "1,2"
      configs:
        Debug:
          INFOPLIST_FILE: Configuration/LocalPreview.plist
schemes:
  PolevoyJournal:
    build:
      targets:
        PolevoyJournal: all
